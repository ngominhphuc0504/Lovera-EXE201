services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - lovera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Otp__Pepper: ${OTP_PEPPER}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__From: ${SMTP_FROM}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-false}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Avatar__Directory: /app/avatars
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - lovera_avatars:/app/avatars
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "dotnet tool install --global dotnet-ef --version 8.0.20 && export PATH=\"$$PATH:/root/.dotnet/tools\" && dotnet restore --force src/Lovera.Repository && dotnet ef database update --project src/Lovera.Repository --startup-project src/Lovera.Repository"]
volumes:
  lovera_pgdata:
  lovera_avatars:
